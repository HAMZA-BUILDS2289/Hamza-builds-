<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviews | Hamza Builds</title><meta name="description" content="Read and leave reviews for Hamza Builds.">
<meta name="theme-color" content="#0C0C0C"><link rel="icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="page inner">
<nav class="nav">
  <a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Price</a><a href="projects.html">Projects</a><a href="blog.html">Blog</a><a href="reviews.html" class="on" aria-current="page">Reviews</a><a href="contact.html">Contact</a>
</nav>
<header class="pagehead"><h1 class="hero-heading sec-title">Reviews</h1><p class="phsub">Worked with me? Leave a review below.</p></header>

<section class="reviews rev-page">
  <div class="rv-wall" id="wall" data-wall hidden></div>
  <form class="rv-form" id="form" novalidate>
    <h3>Leave a review</h3>
    <div class="f2">
      <label>Your name<input name="name" autocomplete="name" maxlength="60" required></label>
      <label>Your phone number<input name="phone" type="tel" autocomplete="tel" maxlength="25" required></label>
    </div>
    <label>The work I did for you<input name="work" maxlength="80" placeholder="For example: clinic website with booking" required></label>
    <fieldset class="stars-in"><legend>Your rating</legend>
      <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="5 stars">&#9733;</label>
      <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="4 stars">&#9733;</label>
      <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="3 stars">&#9733;</label>
      <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="2 stars">&#9733;</label>
      <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="1 star">&#9733;</label>
    </fieldset>
    <label>How did you like it?<textarea name="message" rows="4" maxlength="600" required></textarea></label>
    <input class="hp" type="text" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="hint">Your phone number is only seen by me. It is never shown on the page.</p>
    <button class="btn-contact" type="submit" id="send">Send review</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <p class="hint center" id="modenote" hidden>Preview mode: reviews are saved on this device only.</p>
</section>

<footer class="foot">
  <span>&copy; <span id="yr"></span> hamza_builds</span>

</footer>
</main><script src="js/main.js"></script></body></html>
