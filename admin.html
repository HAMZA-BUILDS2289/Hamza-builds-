<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | Hamza Builds</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0C0C0C">
<link rel="icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="admin" id="admin">
<div class="top"><a href="index.html">&larr; Back to site</a><button class="del" id="signout" type="button" hidden>Sign out</button></div>
<h1 class="hero-heading">Review admin</h1>
<p class="sub">Only the owner can sign in here. You can see phone numbers and delete reviews.</p>
<form class="rv-form" id="owner" novalidate>
  <h3>Owner sign in</h3>
  <label>Email<input id="o-mail" type="email" autocomplete="username" required></label>
  <label>Password<input id="o-pass" type="password" autocomplete="current-password" required></label>
  <button class="btn-contact" type="submit">Sign in</button>
  <p class="msg" id="o-msg" role="status"></p>
</form>
<div class="rv-wall" data-wall aria-live="polite"></div>
<p class="hint center" id="modenote" hidden>Preview mode: any password works and reviews are saved on this device only.</p>
</main><script src="js/main.js"></script></body></html>
